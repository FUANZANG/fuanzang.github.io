<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>404 - 页面走丢了 | FUANZANG</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg, #f6f8fb);
      color: var(--fg, #1f2937);
    }
    @media (prefers-color-scheme: dark) {
      body { --bg: #0b0f17; --fg: #e5e7eb; --muted: #9ca3af; --border: #2a3242; --soft: #141b26; }
    }
    .nf { max-width: 600px; margin: 5rem auto; text-align: center; padding: 0 1.5rem; }
    .nf-code {
      font-size: clamp(5rem, 18vw, 9rem);
      font-weight: 800;
      line-height: 1;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .nf h1 { font-size: 1.8rem; margin: 1rem 0 0.5rem; }
    .nf p { color: var(--muted, #6b7280); margin-bottom: 2rem; }
    .nf-actions { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
    .nf-btn {
      padding: 0.7rem 1.6rem;
      border-radius: 10px;
      font-weight: 600;
      text-decoration: none;
      border: 1px solid var(--border, #d1d5db);
      color: var(--fg, #1f2937);
      background: var(--soft, #f3f4f6);
      cursor: pointer;
      transition: all 0.25s;
    }
    .nf-btn:hover { border-color: #8b5cf6; color: #8b5cf6; }
    .nf-btn.primary {
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      color: #fff;
      border-color: transparent;
    }
  </style>
</head>
<body>
  <div class="nf">
    <div class="nf-code">404</div>
    <h1>页面走丢了</h1>
    <p>你要找的页面不存在，或已经被移动。</p>
    <div class="nf-actions">
      <a class="nf-btn primary" href="/">回到首页</a>
      <a class="nf-btn" href="/notes/html-note">浏览笔记</a>
      <a class="nf-btn" href="/tools">打开工具</a>
    </div>
  </div>
</body>
</html>
