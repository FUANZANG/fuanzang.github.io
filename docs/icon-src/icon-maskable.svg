<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- 渐变铺满整个画布：maskable / apple-touch 由系统自己裁形状，
       不做圆角、不留透明边，否则会露出生成器的默认白色底 -->
  <rect x="0" y="0" width="512" height="512" fill="url(#bg)"/>
  <rect x="0" y="0" width="512" height="512" fill="url(#shine)"/>
  <!-- F 与圆点缩到 80%，稳妥落在 maskable 直径 80% 的安全圆内 -->
  <g transform="translate(256 256) scale(0.8) translate(-256 -256)">
    <path d="M 160 120 L 360 120 L 360 175 L 225 175 L 225 235 L 340 235 L 340 288 L 225 288 L 225 392 L 160 392 Z" fill="#ffffff" opacity="0.95"/>
    <circle cx="370" cy="360" r="28" fill="#ffffff" opacity="0.8"/>
  </g>
</svg>
